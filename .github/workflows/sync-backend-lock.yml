name: Sync backend package lock

on:
  push:
    branches: [release/appstore-hardening]
    paths:
      - backend/package.json
      - .github/workflows/sync-backend-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/appstore-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "package-lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: sync backend package lock"
          git push
